<!doctype html>
<!-- =========================================================
    RESUMO DA PAGINA
    Recebe um e-mail para iniciar a recuperacao de senha.

    MAPA VISUAL:
    body -> .recover-container -> logo
        -> .recover-form -> form -> titulo, descricao,
           mensagens condicionais, email, botao e link.

    LIMITACAO: HTML garante a estrutura e required; o visual
    exato depende de recoverpassword.css.
    ========================================================= -->
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Recuperar senha - PUC Minas</title>

    <!-- Fonte Montserrat - Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Liga esta pagina ao CSS, que sera analisado depois. -->
    <link rel="stylesheet" th:href="@{/css/recoverpassword.css}" />
  </head>

  <body>
    <!-- CLASSE recover-container: agrupa a tela de recuperacao. -->
    <div class="recover-container">
      <!-- CLASSE recover-form: identifica a area do formulario. -->
      <div class="recover-form">
        <!-- form envia o e-mail para /recoverpassword usando POST. -->
        <form th:action="@{/recoverpassword}" method="post">
          <!-- CLASSE recover-image-logo-container: agrupa o logo. -->
          <div class="recover-image-logo-container">
            <img th:src="@{/images/logo-puc.png}" alt="Logo PUC Minas" />
          </div>

          <!-- CLASSE recover-title: identifica o titulo. O texto pode ser revisado para "Recuperar senha". -->
          <h2 class="recover-title">Recuperar senha</h2>

          <!-- CLASSE recover-description: explica o que o usuario deve fazer. -->
          <p class="recover-description">
            Informe seu e-mail para receber as instruções de recuperação de
            senha.
          </p>

          <!-- Duas classes: mensagem geral e variacao de erro. th:if controla a exibicao. -->
          <div
            th:if="${param.erro != null}"
            class="recover-message recover-message-error"
          >
            <strong> E-mail não encontrado! </strong>

            <span> O e-mail informado não está cadastrado. </span>
          </div>

          <!-- th:if mostra sucesso quando o parametro existe; sucess parece grafia incompleta. -->
          <div
            th:if="${param.sucesso}"
            class="recover-message recover-message-sucess"
          >
            <strong> Link enviado com sucesso </strong>
            <span
              >Verifique seu e-mail para continuar a recuperação de senha.</span
            >
          </div>

          <!-- input text recebe o e-mail; required impede envio vazio no navegador. -->
          <input
            type="text"
            name="email"
            id="email"
            placeholder="E-mail"
            autocomplete="email"
            required
          />

          <!-- CLASSE recover-button-container: agrupa o botao submit. -->
          <div class="recover-button-container">
            <button type="submit">Recuperar senha</button>
          </div>

          <!-- CLASSE recover-redirect-options: agrupa o link de retorno. -->
          <div class="recover-redirect-options">
            Lembrou sua senha?
            <a th:href="@{/login}">Faça login</a>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>

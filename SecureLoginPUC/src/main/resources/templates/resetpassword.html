<!doctype html>
<!-- =========================================================
    RESUMO DA PAGINA
    Permite definir uma nova senha e confirma-la.

    MAPA VISUAL:
    body -> .reset-container
            -> logo
            -> .reset-form -> form -> titulo, descricao,
              erro, token oculto, duas senhas, orientacao,
              botao e link para login.

    LIMITACAO: sem CSS, e possivel explicar estrutura, campos,
    validacoes e Thymeleaf, mas nao a aparencia final.
    ========================================================= -->
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Redefinir senha - PUC Minas</title>

    <!-- Fonte Montserrat - Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Vincula o CSS, que sera analisado separadamente depois. -->
    <link rel="stylesheet" th:href="@{/css/resetpassword.css}" />
  </head>

  <body>
    <!-- CLASSE reset-container: agrupa toda a tela de redefinicao. -->
    <div class="reset-container">
      <!-- CLASSE reset-form: identifica a area do formulario. -->
      <div class="reset-form">
        <!-- form envia os dados para /resetpassword usando POST. -->
        <form th:action="@{/resetpassword}" method="post">
          <!-- CLASSE reset-image-logo-container: agrupa o logo. -->
          <div class="reset-image-logo-container">
            <img th:src="@{/images/logo-puc.png}" alt="Logo PUC Minas" />
          </div>

          <!-- CLASSE reset-title: identifica o titulo da pagina. -->
          <h2 class="reset-title">Redefinir senha</h2>
          <!-- CLASSE reset-description: apresenta instrucoes ao usuario. -->
          <p class="reset-description">Digite sua nova senha abaixo.</p>

          <!-- Duas classes: reset-message e reset-message-error. th:if mostra erro especifico. -->
          <div
            th:if="${param.erro != null and param.erro[0] == 'senhas'}"
            class="reset-message reset-message-error"
          >
            <strong>Senhas diferentes!</strong
            ><span>As senhas informadas não são iguais.</span>
          </div>
          <!-- hidden envia o token sem exibi-lo; th:value preenche seu valor no servidor. -->
          <input type="hidden" name="token" th:value="${token}" />
          <!-- password oculta os caracteres e aplica validacao nativa. -->
          <input
            type="password"
            name="password"
            id="password"
            placeholder="Senha"
            autocomplete="new-password"
            minlength="8"
            pattern="?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,}"
            title="A senha deve ter pelo menos 8 caracteres, uma letra maiúscula, uma letra minúscula, um número e um símbolo"
            required
          />
          <small>
            A senha deve ter pelo menos 8 caracteres, uma letra maiúscula, uma
            letra minúscula, um número e um símbolo.
          </small>

          <!-- Segundo campo permite confirmar a senha; a igualdade entre campos depende do servidor. -->
          <input
            type="password"
            name="confirmarSenha"
            id="confirmarSenha"
            placeholder="Confirmar nova senha"
            autocomplete="new-password"
            required
          />
          <!-- CLASSE reset-button-container: agrupa o envio do formulario. -->
          <div class="reset-button-container">
            <button type="submit">Redefinir senha</button>
          </div>
          <!-- CLASSE reset-redirect-options: agrupa o link de retorno. -->
          <div class="reset-redirect-options">
            <a th:href="@{/login}">Voltar para o login</a>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
